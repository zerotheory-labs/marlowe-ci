name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Semgrep for replay integration tests
        run: pipx install semgrep==1.185.0

      - name: Run test suite
        env:
          MARLOWE_TEST_REQUIRE_SEMGREP: '1'
        run: npm test

      - name: Run Marlowe CI self-check
        run: npm run self-check
